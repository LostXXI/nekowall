[workspace]
resolver = "2"
members = [
    "crates/nekowall-backend",
    "crates/nekowall-library",
    "crates/nekowall-plasma",
    "crates/nekowall-mate",
    "crates/nekowall-niri",
    "crates/nekowall-wlr",
    "crates/nekowall-core",
    "crates/nekowall-cli",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "PolyForm-Noncommercial-1.0.0"   # ver LICENSE

[profile.release]
lto = true
opt-level = "s"
strip = true
